metricbeat.modules:
- module: elasticsearch
  xpack.enabled: true
  period: 10s
  hosts: ["${ELASTIC_HOSTS}"]

- module: logstash
  xpack.enabled: true
  period: 10s
  hosts: ["${LOGSTASH_HOSTS}"]

- module: kibana
  metricsets: [stats]
  period: 10s
  hosts: ["${KIBANA_HOSTS}"]
  xpack.enabled: true

- module: docker
  metricsets: ["container", "cpu", "diskio", "memory", "network"]
  hosts: ["unix:///var/run/docker.sock"]
  period: 10s
  enabled: true

processors:
  - add_host_metadata: ~
  - add_docker_metadata: ~

output.elasticsearch:
  hosts: ["${ELASTIC_HOSTS}"]