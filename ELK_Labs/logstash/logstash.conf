input {
  file {
    path          => "/logstash_dir/record_matching.log"
    start_position => "beginning"
    sincedb_path  => "/dev/null"
  }
}

filter {
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp} - %{LOGLEVEL:log_level} - %{GREEDYDATA:raw_message}" }
  }
  json {
    source             => "raw_message"
    target             => "payload"
    skip_on_invalid_json => true
  }
  mutate {
    remove_field => ["message", "raw_message"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "record-matching-%{+YYYY.MM.dd}"
  }
}